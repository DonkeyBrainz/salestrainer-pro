repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      # Backend hooks
      - id: backend-format
        name: backend format (ruff)
        entry: bash -c 'cd backend && uv run ruff format --check app/'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: backend-lint
        name: backend lint (ruff)
        entry: bash -c 'cd backend && uv run ruff check app/'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: backend-typecheck
        name: backend typecheck (mypy)
        entry: bash -c 'cd backend && uv run mypy app/'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: backend-tests
        name: backend tests (pytest)
        entry: bash -c 'cd backend && uv run pytest -q --no-header --tb=short'
        language: system
        pass_filenames: false
        files: ^backend/

      # Frontend hooks
      - id: frontend-typecheck
        name: frontend typecheck (tsc)
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: frontend-tests
        name: frontend tests (vitest)
        entry: bash -c 'cd frontend && npm run test:run'
        language: system
        pass_filenames: false
        files: ^frontend/
