# moving into discovery — the coach should signal readiness to advance.
id: connect_complete_stage_readiness
tags: [stage:connect, technique:stage_transition]
persona_id: optimistic_renovator
cases:
  - salesperson_message: "Now that we've gotten acquainted — tell me, what's your vision for this project? What would make it a home run for you?"
