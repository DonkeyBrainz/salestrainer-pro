    max_first_audio_ms: 25000
    min_output_audio_ms: 300
  - salesperson_text: "The sellers also just replaced the roof in twenty twenty three, so that's a fifteen year warranty you'd inherit."
    forbid_phrases: ["as an AI", "language model"]
    max_wer: 0.5
    max_first_audio_ms: 25000
