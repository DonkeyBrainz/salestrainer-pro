# Numbers stress test: prices, sizes, and counts are where ASR front-ends
# slip. The model must hear figures correctly to respond sensibly.
id: practical_family_numbers_comprehension
tags: [persona:practical_family, voice:comprehension, voice:numbers]
persona_id: practical_family
turns:
  - salesperson_text: "This one is listed at four hundred eighty five thousand, with three bedrooms and two baths on a quarter acre lot."
