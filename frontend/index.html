<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesTrainer Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg:         #0e1410;
        --surface:    #161d18;
        --surface-2:  #1d2620;
        --hair:       #2a342c;
        --hair-soft:  #202a23;
        --ink:        #eef2ec;
        --ink-soft:   #a9b3a8;
        --ink-muted:  #6a7569;
        --terra:      #ff7a48;
        --terra-dim:  #5a3424;
        --sage:       #9bd07c;
        --sage-dim:   #3e5a3a;
        --butter:     #f0c14a;
        --off:        #f1ebe0;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--ink);
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--hair);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--ink-muted);
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeInUp 0.4s ease-out forwards;
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      .pulse-dot {
        animation: pulse-dot 1.4s ease-in-out infinite;
      }

      @keyframes slide-in-right {
        from { opacity: 0; transform: translateX(12px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .slide-in-right {
        animation: slide-in-right 0.2s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
