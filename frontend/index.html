<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesTrainer Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;600&family=Oswald:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --blue: #2058A6;
        --blue-deep: #123157;
        --blue-panel: rgba(255,255,255,0.045);
        --blue-panel-hover: rgba(255,255,255,0.09);
        --line: #FFFFFF;
        --line-dim: rgba(255,255,255,0.35);
        --line-faint: rgba(255,255,255,0.10);
        --amber: #F0A24E;
        --text: #EFF5FF;
        --text-muted: rgba(239,245,255,0.6);
        --hard: #E4574A;
        --standard: #7EB0EE;
        --rapport: #8FBF6B;
        --special: #C79BEE;
        --sticky: #CFE6A8;
        --sticky-ink: #2C3B1E;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        color: var(--text);
        margin: 0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background:
          radial-gradient(ellipse at 50% 35%, var(--blue) 0%, var(--blue-deep) 85%),
          repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 34px),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 34px);
        background-attachment: fixed;
      }

      a { color: var(--amber); }
      a:hover { color: var(--text); }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.15);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.28);
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeInUp 0.4s ease-out forwards;
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      .pulse-dot {
        animation: pulse-dot 1.4s ease-in-out infinite;
      }

      @keyframes slide-in-right {
        from { opacity: 0; transform: translateX(12px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .slide-in-right {
        animation: slide-in-right 0.2s ease-out forwards;
      }

      @keyframes stickyPulse {
        0%, 100% { box-shadow: 3px 4px 10px rgba(0,0,0,0.3); }
        50% { box-shadow: 0 0 0 4px rgba(240,162,78,0.85), 3px 4px 14px rgba(0,0,0,0.4); }
      }
      .sticky-pulse {
        animation: stickyPulse 0.8s ease 2;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
