<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxe Sales Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-stone-50: #F9F8F6;
        --color-stone-100: #F0EFEA;
        --color-stone-800: #2C2825;
        --color-stone-900: #1A1816;
        --color-accent: #8B5E3C;
      }
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: var(--color-stone-50);
        color: var(--color-stone-900);
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cormorant Garamond', serif;
      }
      .font-serif-display {
        font-family: 'Cormorant Garamond', serif;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d6d3d1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a29e;
      }

      .fade-in {
        animation: fadeIn 0.8s ease-out forwards;
        opacity: 0;
      }
      .fade-in-delay-1 { animation-delay: 0.2s; }
      .fade-in-delay-2 { animation-delay: 0.4s; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
